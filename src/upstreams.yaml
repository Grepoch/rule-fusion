# ============================================================
# upstreams.yaml — 已审核的上游规则源清单
# ------------------------------------------------------------
# fetch_and_merge.py 会按此清单拉取每个 enabled 的源。
#
# 字段说明:
#   name      可读名称，用于日志输出
#   url       上游 raw 链接
#   format    上游原始格式: domain | classical | hosts | adblock
#   category  归类到哪个产物文件名: reject | ai | google | telegram | ...
#   enabled   是否启用 (未审核 license 与质量前请保持 false)
#
# 产物映射:
#   category: reject  → Reject.mrs / Reject.srs / Reject.list
#   category: ai      → AI.mrs / AI.srs / AI.list
#   category: google  → Google.mrs / Google.srs / Google.list
#   ...以此类推（首字母大写）
# ============================================================

sources:
  # ════════════════════════════════════════════════════════════
  # 广告拦截 (Reject)
  # ════════════════════════════════════════════════════════════
  - name: mock-upstream-a
    url: mock://virtual-upstream-a
    format: domain
    category: reject
    enabled: true

  - name: mock-upstream-b
    url: mock://virtual-upstream-b
    format: domain
    category: reject
    enabled: true

  - name: blackmatrix7-Advertising
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising_Domain.txt
    format: domain
    category: reject
    enabled: true

  - name: LM-Firefly-Adblock
    url: https://raw.githubusercontent.com/LM-Firefly/Rules/master/Adblock-lite.list
    format: classical
    category: reject
    enabled: false

  # ════════════════════════════════════════════════════════════
  # AI 服务 (合并 OpenAI + Claude + Copilot + Gemini)
  # ════════════════════════════════════════════════════════════
  - name: blackmatrix7-OpenAI
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
    format: classical
    category: ai
    enabled: true

  - name: blackmatrix7-Claude
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
    format: classical
    category: ai
