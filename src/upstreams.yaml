# ============================================================
# upstreams.yaml — 已审核的上游规则源清单
# ------------------------------------------------------------
# fetch_and_merge.py 会按此清单拉取每个 enabled 的源。
#
# 字段说明:
#   name      可读名称，用于日志输出
#   url       上游 raw 链接
#   format    上游原始格式: domain | classical | hosts | adblock
#   category  归类到哪个产物文件名: reject | ai | google | telegram | ...
#   enabled   是否启用 (未审核 license 与质量前请保持 false)
#
# 安全约定:
#   - 任何新增源默认 enabled: false，先在本地跑过、对过 diff 再开启
#   - URL 必须是 raw 链接，不要写仓库主页
#   - 优先选用稳定 main / master 分支，避免引用 commit hash 失效
#
# 产物映射:
#   category: reject  → dist/mihomo/domain/Reject.mrs
#   category: ai      → dist/mihomo/domain/AI.mrs
#   category: google  → dist/mihomo/domain/Google.mrs
#   ...以此类推
# ============================================================

sources:
  # ════════════════════════════════════════════════════════════
  # 广告拦截 (Reject)
  # ════════════════════════════════════════════════════════════
  - name: mock-upstream-a
    url: mock://virtual-upstream-a
    format: domain
    category: reject
    enabled: true

  - name: mock-upstream-b
    url: mock://virtual-upstream-b
    format: domain
    category: reject
    enabled: true

