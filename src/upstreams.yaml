# ============================================================
# upstreams.yaml — 已审核的上游规则源清单
# ------------------------------------------------------------
# 产物映射: category → 输出目录
#   category: reject → mihomo/Reject/Reject-Site.mrs
#   category: ai     → mihomo/AI/AI-Site.mrs
#   ...以此类推
# ============================================================

sources:
  # ════════════════════════════════════════════════════════════
  # 广告拦截 (Reject)
  # ════════════════════════════════════════════════════════════
  - name: mock-upstream-a
    url: mock://virtual-upstream-a
    format: domain
    category: reject
    enabled: true

  - name: mock-upstream-b
    url: mock://virtual-upstream-b
    format: domain
    category: reject
    enabled: true

  - name: blackmatrix7-Advertising
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising_Domain.txt
    format: domain
    category: reject
    enabled: true

  # ════════════════════════════════════════════════════════════
  # 用户追踪 (Tracking) — 区别于广告
  # ════════════════════════════════════════════════════════════
  - name: blackmatrix7-Privacy
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Privacy/Privacy.list
    format: classical
    category: tracking
    enabled: true

