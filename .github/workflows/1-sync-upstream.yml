name: 1 · Sync Upstream Rules

on:
  schedule:
    # 02:00 Asia/Shanghai (= 18:00 UTC previous day)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Fetch & merge → open Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch & merge
        run: python scripts/fetch_and_merge.py

      - name: Show diff (visibility)
        run: |
          git status
          git --no-pager diff --stat || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/sync-upstream-rules
          delete-branch: true
          commit-message: "chore: sync upstream rules"
          title: "Auto Sync Upstream Rules"
          body: |
            🤖 **Automated upstream sync**

            This PR was generated by `1-sync-upstream.yml`.
            It intentionally opens a PR instead of pushing directly to `main`,
            so upstream poisoning or accidental false positives can be caught
            during human review.

            ## Review checklist
            - [ ] No high-value domain leaked into the reject list
            - [ ] Whitelist is still effective (compare with `src/whitelist.txt`)
            - [ ] Net add / remove counts match expectations
            - [ ] No suspicious upstream behavior (mass deletion, sudden surge, etc.)

            Merge when satisfied. **No automatic merge.**
          labels: |
            automated
            upstream-sync
          add-paths: |
            src/**
            dist/**
